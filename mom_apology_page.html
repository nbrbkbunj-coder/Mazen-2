<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رسالة لماما</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle, #0a0a0a, #000000);
      font-family: 'Cairo', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* لمعة نيون */
    .glow {
      text-shadow: 0 0 10px #ff007b, 0 0 20px #ff007b, 0 0 40px #ff007b;
    }

    .card {
      background: rgba(20, 20, 20, 0.8);
      border: 2px solid #ff007b;
      padding: 35px;
      border-radius: 25px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 25px #ff007baa;
      max-width: 420px;
      animation: float 3s ease-in-out infinite;
      text-align: center;
    }

    h1 {
      color: #ff4fa3;
      font-size: 32px;
      margin-bottom: 15px;
    }

    p {
      color: #f0f0f0;
      font-size: 20px;
      line-height: 1.7;
    }

    /* حركة بسيطة للبطاقة */
    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    /* خلفية تأثير نيون متحرك */
    .neon-bg {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #ff007b;
      filter: blur(150px);
      animation: move 6s infinite alternate;
      opacity: 0.4;
    }

    @keyframes move {
      0% { top: 10%; left: 15%; }
      100% { top: 60%; left: 65%; }
    }
  </style>
</head>
<body>
  <div class="neon-bg"></div>
  <div class="card">
    <h1 class="glow">ماما الحبيبة ❤️</h1>
    <p>أنا آسف لو زعلتك بدون قصد. انتي أغلى حد في حياتي، وبوعدك أكون أحسن كل يوم.
    بحبك يا أحلى ماما في الدنيا 💖</p>
  </div>
</body>
</html>
